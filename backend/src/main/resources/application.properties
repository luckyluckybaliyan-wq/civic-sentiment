server.port=8080

# ---- Default: in-memory H2 (zero setup) ----
spring.datasource.url=jdbc:h2:mem:civicdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- To use MySQL instead, comment the H2 block above and uncomment below ----
# spring.datasource.url=jdbc:mysql://localhost:3306/civicconnect?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=yourpassword

# JWT (change the secret in production; must be 32+ characters)
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-something-long-and-random-123456}
app.jwt.expiration-ms=86400000

# Allowed frontend origin
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
